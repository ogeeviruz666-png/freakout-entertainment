<body class="song-page">
<div class="page-transition"></div>
<header class="site-header">
<a class="brand" href="index.html"><img src="official-logo.png" alt="Freak Out Entertainment"></a>

<main data-song-page>
<section class="song-engine-hero" data-song-hero>
<div class="film-grain"></div>
<div class="song-engine-copy reveal visible">
<p class="kicker">OG Famous • Freak Out Entertainment LLC</p>
<h1 data-song-title>SONG</h1>
<p class="tagline" data-song-tagline></p>
<button class="custom-song-play" data-custom-play type="button">▶ PLAY</button>
<p class="audio-status" data-audio-status>Loading audio…</p>
<audio class="native-song-player" data-song-audio controls preload="metadata" playsinline></audio>
</div>
</section>

<section class="section split reveal visible">
<div><p class="kicker">Behind the Record</p><h2>THE STORY<br><em>BEHIND THE SONG.</em></h2></div>
<div class="body-copy"><p class="lead" data-song-story></p></div>
</section>

<section class="section song-content-grid reveal visible">
<div class="song-cover-panel"><img data-song-cover src="" alt=""></div>
<div class="lyrics-panel">
<p class="kicker">Official Lyrics</p>
<h2>READ THE<br><em>RECORD.</em></h2>
<div data-song-lyrics></div>
</div>
</section>

<section class="section reveal visible">
<p class="kicker">Song Information</p>
<h2>OFFICIAL<br><em>CREDITS.</em></h2>
<div class="credits-grid" data-song-credits></div>
</section>
